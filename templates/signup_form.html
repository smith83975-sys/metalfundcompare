<form class="signup" method="POST" action="https://app.kit.com/forms/10053925/subscriptions" accept-charset="UTF-8" data-kit-form="10053925">
    <label class="sr" for="em-{{ form_id|default('box') }}">Email address</label>
    <input id="em-{{ form_id|default('box') }}" type="email" name="email_address" placeholder="you@example.com" autocomplete="email" required>
    <button type="submit">Subscribe</button>
    <p class="signup-msg" role="status" aria-live="polite"></p>
    <small>Your email goes to our newsletter provider, Kit. Unsubscribe anytime. <a href="/disclaimer/#privacy">Privacy</a></small>
  </form>
